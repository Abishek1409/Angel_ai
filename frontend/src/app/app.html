<div class="app-shell">
  <header class="app-header">
    <div class="app-logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" class="logo-icon">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>AngelAI</span>
    </div>
  </header>

  <main class="app-main">
    @if (!documentId) {
      <app-upload [sessionId]="sessionId" (documentReady)="onDocumentReady($event)" />
    } @else {
      <app-chat
        [documentId]="documentId"
        [sessionId]="sessionId"
        (newDocument)="onNewDocument()"
      />
    }
  </main>
</div>
