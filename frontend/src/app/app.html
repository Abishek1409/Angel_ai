@if (!isReady) {
  <div class="auth-loading">Loading AngelAI...</div>
} @else if (!auth.username()) {
  <app-theme-toggle class="floating-theme-toggle" />
  <app-auth (authenticated)="initializeWorkspace()" />
} @else {
<div class="app-shell">
  <header class="app-header">
    <div class="app-logo">
      <app-mascot class="logo-mascot" [size]="34" [still]="true" [talk]="false" />
      <span>AngelAI</span>
    </div>
    <div class="app-header__actions">
      <app-theme-toggle />
      <button class="logout-button" type="button" (click)="logout()">Sign out</button>
    </div>
  </header>

  <main class="app-main" [class.app-main--with-sidebar]="showDocumentList">
    <app-session-history
      [refreshToken]="sessionHistoryRefresh"
      (sessionSelected)="onSessionSelected($event)"
      (sessionDeleted)="onSessionDeleted()"
    />
    @if (showDocumentList) {
      <app-document-list
        [sessionId]="sessionId"
        [refreshToken]="documentListRefresh"
        (documentSelected)="onDocumentSelected($event)"
        (uploadNew)="onUploadNew()"
      />
    }

    <div class="app-content">
      @if (workspaceError) {
        <p class="workspace-error" role="alert">{{ workspaceError }}</p>
      }
      @if (currentView === 'upload') {
        <app-upload [sessionId]="sessionId" (documentReady)="onDocumentReady($event)" />
      } @else if (currentView === 'chat') {
        <app-chat
          [documentId]="documentId"
          [sessionId]="sessionId"
          (newDocument)="onNewDocument()"
        />
      }
    </div>
  </main>
</div>
}
