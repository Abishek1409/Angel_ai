<div class="chat-wrap">
  <!-- Toolbar -->
  <div class="chat-toolbar">
    <span class="chat-toolbar__title">Chat</span>
    <button class="new-doc-btn" (click)="onNewDocument()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="12" y1="18" x2="12" y2="12"/>
        <line x1="9" y1="15" x2="15" y2="15"/>
      </svg>
      New document
    </button>
  </div>

  <!-- Messages -->
  <div class="chat-messages" aria-live="polite">
    <div *ngIf="conversation.length === 0 && !isLoading" class="chat-empty">
      <p>Ask a question about your document</p>
    </div>

    <app-message
      *ngFor="let msg of conversation"
      [question]="msg.question"
      [answer]="msg.answer"
    ></app-message>

    <div *ngIf="isLoading" class="chat-thinking">
      <span></span><span></span><span></span>
    </div>
  </div>

  <!-- Error -->
  <div *ngIf="errorMessage" class="chat-error" role="alert">{{ errorMessage }}</div>

  <!-- Input -->
  <form class="chat-input-wrap" (ngSubmit)="onSubmit()">
    <textarea
      class="chat-input"
      [(ngModel)]="question"
      name="question"
      placeholder="Ask a question…"
      [disabled]="isLoading"
      aria-label="Question input"
      autocomplete="off"
      rows="1"
      (keydown.enter)="$event.preventDefault(); onSubmit()"
    ></textarea>
    <button
      class="chat-send"
      type="submit"
      [disabled]="isDisabled"
      aria-label="Send"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </form>
</div>
