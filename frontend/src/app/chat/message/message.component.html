<div class="msg">
  <div class="msg__user">
    <div class="msg__avatar msg__avatar--user">You</div>
    <div class="msg__bubble msg__bubble--user">{{ question }}</div>
  </div>
  <div class="msg__ai">
    <div class="msg__avatar msg__avatar--ai">AI</div>
    <div class="msg__bubble msg__bubble--ai">
      {{ answer }}
      <div *ngIf="sources && sources.length > 0" class="msg__sources">
        <div class="msg__sources-label">Sources:</div>
        <div class="msg__sources-list">
          <span *ngFor="let source of sources; let last = last" class="msg__source">
            {{ source }}<span *ngIf="!last">, </span>
          </span>
        </div>
      </div>
      <div *ngIf="cached" class="msg__cache-badge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
        Cached
      </div>
    </div>
  </div>
</div>
