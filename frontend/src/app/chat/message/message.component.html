<div class="msg">
  <div class="msg__row msg__row--user">
    <div class="msg__bubble msg__bubble--user">
      <p>{{ question }}</p>
    </div>
    <div class="msg__avatar msg__avatar--user">You</div>
  </div>

  <div class="msg__row msg__row--ai">
    <div class="msg__avatar msg__avatar--ai">AI</div>
    <div class="msg__bubble msg__bubble--ai">
      <p>{{ answer }}</p>
    </div>
  </div>
</div>
