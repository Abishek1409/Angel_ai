<section class="side-section" aria-label="Documents">
  <h3 class="side-section__title">Documents</h3>

  @if (isLoading) {
    <p class="side-section__note">Loading…</p>
  } @else {
    @if (errorMessage) {
      <p class="side-section__note side-section__note--error">{{ errorMessage }}</p>
    }
    @if (documents.length === 0) {
      <button class="side-row side-row--ghost" type="button" (click)="onUploadNew()">Upload your first PDF</button>
    }
    @for (doc of documents; track doc.id) {
      <div
        class="side-row"
        role="button"
        tabindex="0"
        [class.side-row--active]="(activeDocumentId !== undefined ? activeDocumentId : selectedDocId) === doc.id"
        (click)="selectDocument(doc.id)"
        (keydown.enter)="selectDocument(doc.id)"
      >
        <svg class="side-row__icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
        <span class="side-row__label" [title]="doc.filename">{{ doc.filename }}</span>
        @if (doc.status !== 'ready') {
          <span class="side-row__badge" [class]="getStatusClass(doc.status)" [title]="doc.error_message || ''">{{ getStatusLabel(doc.status) }}</span>
        }
        @if (doc.status !== 'pending') {
          <button class="side-row__action" type="button" (click)="deleteDocument(doc.id, $event)" aria-label="Delete document" title="Delete document">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
        }
      </div>
    }
  }
</section>
