<div class="upload-wrap">
  <div class="upload-hero">
    <h1 class="upload-title">What would you like to explore?</h1>
    <p class="upload-subtitle">Upload a document and ask questions about it</p>
  </div>

  <div class="upload-card">
    <label
      class="drop-zone"
      for="file-input"
      [class.drop-zone--active]="selectedFile"
      [class.drop-zone--busy]="isBusy"
    >
      <div class="drop-zone__icon">
        <svg *ngIf="!selectedFile" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
        <svg *ngIf="selectedFile" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <span class="drop-zone__text" *ngIf="!selectedFile">Click to choose a file</span>
      <span class="drop-zone__filename" *ngIf="selectedFile">{{ selectedFile.name }}</span>
      <span class="drop-zone__hint">PDF or TXT · up to 20 MB</span>
      <input
        id="file-input"
        type="file"
        accept=".pdf,.txt"
        (change)="onFileSelected($event)"
        [disabled]="isBusy"
        class="drop-zone__input"
        aria-label="Select a PDF or TXT file"
      />
    </label>

    <p *ngIf="errorMessage" class="upload-error" role="alert">{{ errorMessage }}</p>

    <button
      class="upload-btn"
      (click)="onSubmit()"
      [disabled]="!selectedFile || isBusy"
    >
      <span class="upload-btn__spinner" *ngIf="isBusy"></span>
      <span *ngIf="!isBusy">Analyze document</span>
      <span *ngIf="isBusy">{{ status === 'uploading' ? 'Uploading…' : 'Processing…' }}</span>
    </button>

    <p *ngIf="status === 'ready'" class="upload-success" role="status">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      {{ uploadedFilename }} is ready
    </p>
  </div>
</div>
