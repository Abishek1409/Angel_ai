services:
  - type: web
    name: angel-ai-backend
    env: python
    healthCheckPath: /health/
    buildCommand: apt-get update && apt-get install -y --no-install-recommends tesseract-ocr poppler-utils && cd backend && pip install --no-cache-dir --upgrade -r requirements.txt && python manage.py migrate
    startCommand: cd backend && gunicorn --pythonpath . config.wsgi:application --bind 0.0.0.0:$PORT --timeout 120 --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: angel-ai-cak5.onrender.com,localhost,127.0.0.1
      - key: DJANGO_SECRET_KEY
        generateValue: true
